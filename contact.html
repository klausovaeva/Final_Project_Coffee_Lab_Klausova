<div id="container">
    <main>
        <article>
            <h2>Get in touch</h2>
            <form id="contactForm">
                <label for="name">Name:</label>
                <input type="text" id="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" required>

                <label for="type">Inquiry:</label>
                <select id="type">
                    <option>Beans</option>
                    <option>Workshops</option>
                </select>

                <fieldset>
                    <legend>Urgency:</legend>
                    <label><input type="radio" name="u" value="low" checked> Normal</label>
                    <label><input type="radio" name="u" value="high"> Urgent</label>
                </fieldset>

                <label>
                    <input type="checkbox" id="sub"> Newsletter
                </label>

                <label for="msg">Message:</label>
                <textarea id="msg" rows="4"></textarea>

                <button type="submit" onclick="console.log('Submit button clicked!')">Send</button>
            </form>
            <div id="feedback"></div>
        </article>
    </main>
</div>
